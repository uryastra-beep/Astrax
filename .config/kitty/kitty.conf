# ── kitty · serpantinum ─────────────────────────────────────────────
# Colors: colors.conf is regenerated by Serpantinum (matugen) on every theme and
# reloads kitty by itself (killall -USR1), so the terminal always matches.

# font (the same one the Serpantinum bar uses)
font_family                 Iosevka Nerd Font
bold_font                   auto
italic_font                 auto
font_size                   12.5
disable_ligatures           cursor

# window
background_opacity          0.6
dynamic_background_opacity  yes
window_padding_width        12 16
hide_window_decorations     yes
confirm_os_window_close     0
remember_window_size        no
initial_window_width        110c
initial_window_height       30c

# cursor (like the intro's: smooth, with a trail)
cursor_shape                beam
cursor_beam_thickness       2
cursor_blink_interval       0.6 ease-in-out
cursor_stop_blinking_after  15
cursor_trail                3
cursor_trail_decay          0.08 0.35
cursor_trail_start_threshold 2

# scroll and selection
scrollback_lines            10000
wheel_scroll_multiplier     3
copy_on_select              no
url_style                   curly
detect_urls                 yes

# tabs: rounded pills like the bar pills
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         round
tab_bar_min_tabs            2
tab_title_template          " {index} {title[:24]} "
active_tab_font_style       bold
inactive_tab_font_style     normal

# no beeps, soft visual bell instead
enable_audio_bell           no
visual_bell_duration        0.12
visual_bell_color           none

# active Serpantinum theme colors
include colors.conf
