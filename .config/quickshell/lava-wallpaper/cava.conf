# cava for the lava only: 6 mono bars, the low ones move the bubbles
[general]
framerate = 45
bars = 6

[input]
method = pulse
source = easyeffects_sink.monitor

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 40
gravity = 150
